<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Document Vault</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234f46e5'/%3E%3Cpath d='M9 8h9l5 5v11a1 1 0 0 1-1 1H9a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z' fill='none' stroke='white' stroke-width='2.2' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #f6f7fb; --bg-glow: #e8e9ff; --surface: #ffffff; --surface-2: #f1f2f7;
    --text: #14151a; --muted: #62646f; --faint: #9a9ca8; --border: #e3e5ee;
    --accent: #4f46e5; --accent-2: #7c3aed; --accent-soft: #eef0ff; --on-accent: #ffffff;
    --good: #15803d; --good-soft: #e7f6ec; --warn: #a16207; --warn-soft: #fdf4dc; --bad: #b42318; --bad-soft: #fdeceb;
    --mark: #fff1b8; --shadow: 0 1px 2px rgba(20, 21, 26, .04), 0 6px 20px rgba(20, 21, 26, .06);
    --user-bubble: #4f46e5; --on-user-bubble: #ffffff;
    --c-insurance: #2563eb; --c-insurance-soft: #e8efff;
    --c-warranty: #15803d; --c-warranty-soft: #e7f6ec;
    --c-bill: #b45309; --c-bill-soft: #fdf1e3;
    --c-property: #7c3aed; --c-property-soft: #f1ebff;
    --c-other: #52525b; --c-other-soft: #f0f0f2;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0d0e12; --bg-glow: #1b1840; --surface: #16171d; --surface-2: #1d1f27;
      --text: #ecedf2; --muted: #a0a3b1; --faint: #6b6e7c; --border: #2a2c36;
      --accent: #8b85ff; --accent-2: #b38cff; --accent-soft: #23214a; --on-accent: #0d0e12;
      --good: #6ee7a0; --good-soft: #10291b; --warn: #f5c46b; --warn-soft: #2e230c; --bad: #ff9b90; --bad-soft: #33130f;
      --mark: #4a3f10; --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 6px 20px rgba(0, 0, 0, .35);
      --user-bubble: #3a36a8; --on-user-bubble: #ffffff;
      --c-insurance: #8fb3ff; --c-insurance-soft: #16223d;
      --c-warranty: #6ee7a0; --c-warranty-soft: #10291b;
      --c-bill: #f5b36b; --c-bill-soft: #2e1f0c;
      --c-property: #c4a5ff; --c-property-soft: #24193d;
      --c-other: #b4b4bd; --c-other-soft: #23242b;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0d0e12; --bg-glow: #1b1840; --surface: #16171d; --surface-2: #1d1f27;
    --text: #ecedf2; --muted: #a0a3b1; --faint: #6b6e7c; --border: #2a2c36;
    --accent: #8b85ff; --accent-2: #b38cff; --accent-soft: #23214a; --on-accent: #0d0e12;
    --good: #6ee7a0; --good-soft: #10291b; --warn: #f5c46b; --warn-soft: #2e230c; --bad: #ff9b90; --bad-soft: #33130f;
    --mark: #4a3f10; --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 6px 20px rgba(0, 0, 0, .35);
    --user-bubble: #3a36a8; --on-user-bubble: #ffffff;
    --c-insurance: #8fb3ff; --c-insurance-soft: #16223d;
    --c-warranty: #6ee7a0; --c-warranty-soft: #10291b;
    --c-bill: #f5b36b; --c-bill-soft: #2e1f0c;
    --c-property: #c4a5ff; --c-property-soft: #24193d;
    --c-other: #b4b4bd; --c-other-soft: #23242b;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: radial-gradient(1200px 480px at 50% -160px, var(--bg-glow), transparent 70%), var(--bg);
    background-repeat: no-repeat; background-color: var(--bg); color: var(--text);
    font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased; min-height: 100vh;
  }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  a { color: var(--accent); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  [hidden] { display: none !important; }

  /* Top bar */
  .topbar { width: 100%; max-width: 1280px; margin: 0 auto; padding: 14px 16px; display: flex; align-items: center; gap: 10px; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; letter-spacing: -.01em; white-space: nowrap; }
  .logo { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; color: #fff;
          background: linear-gradient(135deg, var(--accent), var(--accent-2)); }
  .spacer { flex: 1; }
  .pill { font-size: 12px; font-weight: 500; color: var(--muted); background: var(--surface); border: 1px solid var(--border);
          padding: 4px 10px; border-radius: 999px; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; }
  .pill .dot-s { width: 7px; height: 7px; border-radius: 50%; background: var(--faint); }
  .pill.ready .dot-s { background: var(--good); }
  .pill.not-ready { color: var(--warn); border-color: var(--warn); }
  .pill.not-ready .dot-s { background: var(--warn); }
  .btn { border: 1px solid var(--border); background: var(--surface); border-radius: 10px; padding: 6px 12px; font-size: 13px;
         font-weight: 600; display: inline-flex; align-items: center; gap: 6px; color: var(--text); white-space: nowrap; }
  .btn:hover { border-color: var(--faint); }
  .icon-btn { width: 34px; height: 34px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface);
              display: inline-grid; place-items: center; color: var(--muted); flex: none; }
  .icon-btn:hover { color: var(--text); border-color: var(--faint); }
  #docs-toggle { display: none; }
  @media (max-width: 1020px) { #docs-toggle { display: inline-flex; } }
  @media (max-width: 560px) { .pill.privacy, .btn .label { display: none; } .brand .name { display: none; } }

  /* Layout */
  .layout { width: 100%; max-width: 1280px; margin: 0 auto; padding: 0 16px; display: grid; gap: 24px;
            grid-template-columns: minmax(0, 1fr) 330px; align-items: start; }
  @media (max-width: 1020px) { .layout { grid-template-columns: minmax(0, 1fr); } }

  /* Chat column */
  .chat { display: flex; flex-direction: column; min-height: calc(100vh - 62px); max-width: 780px; width: 100%; margin: 0 auto; }
  .thread { flex: 1; padding: 8px 0 24px; }

  .welcome { text-align: center; padding: 7vh 4px 24px; }
  .welcome .big-logo { width: 52px; height: 52px; border-radius: 16px; display: inline-grid; place-items: center; color: #fff;
                       background: linear-gradient(135deg, var(--accent), var(--accent-2)); box-shadow: var(--shadow); }
  .welcome h1 { font-size: clamp(24px, 4vw, 32px); letter-spacing: -.02em; margin: 18px 0 6px; }
  .welcome p { color: var(--muted); margin: 0 auto 22px; max-width: 520px; }
  .suggestions { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; max-width: 620px; margin: 0 auto; text-align: left; }
  @media (max-width: 560px) { .suggestions { grid-template-columns: 1fr; } }
  .suggestion { border: 1px solid var(--border); background: var(--surface); border-radius: 14px; padding: 12px 14px; font-size: 14px;
                text-align: left; transition: border-color .15s, transform .15s; }
  .suggestion:hover { border-color: var(--accent); transform: translateY(-1px); }
  .suggestion small { display: block; color: var(--faint); font-size: 12px; margin-bottom: 2px; text-transform: capitalize; }

  .setup { display: flex; gap: 10px; align-items: flex-start; background: var(--warn-soft); color: var(--warn);
           border-radius: 12px; padding: 12px 14px; margin: 0 auto 16px; font-size: 14px; text-align: left; max-width: 620px; }
  .setup svg { flex: none; margin-top: 2px; }

  .msg { display: flex; gap: 12px; margin: 18px 0; animation: rise .2s ease both; }
  .msg.user { justify-content: flex-end; }
  .msg.user .bubble { background: var(--user-bubble); color: var(--on-user-bubble); border-radius: 18px 18px 4px 18px;
                      padding: 10px 16px; max-width: 80%; white-space: pre-wrap; overflow-wrap: anywhere; }
  .avatar { flex: none; width: 32px; height: 32px; border-radius: 10px; display: grid; place-items: center; color: #fff;
            background: linear-gradient(135deg, var(--accent), var(--accent-2)); margin-top: 2px; }
  .msg.bot .body { min-width: 0; flex: 1; padding-top: 4px; }
  .msg.bot .content { font-size: 16px; line-height: 1.6; overflow-wrap: anywhere; }
  .content p { margin: 0 0 10px; }
  .content p:last-child { margin-bottom: 0; }
  .content ul, .content ol { margin: 4px 0 10px; padding-left: 22px; }
  .content li { margin: 3px 0; }
  .cite { border: 0; border-radius: 6px; padding: 0 5px; margin: 0 1px; font-size: 11px; font-weight: 700; vertical-align: 2px;
          background: var(--accent-soft); color: var(--accent); line-height: 1.6; }
  .cite:hover { background: var(--accent); color: var(--on-accent); }
  .caret { display: inline-block; width: 8px; height: 1.05em; background: var(--accent); vertical-align: -2px; margin-left: 2px;
           border-radius: 2px; animation: blink 1s steps(2) infinite; }
  .typing { display: inline-flex; gap: 4px; padding: 8px 0; }
  .typing span { width: 7px; height: 7px; border-radius: 50%; background: var(--faint); animation: bounce 1.2s infinite ease-in-out; }
  .typing span:nth-child(2) { animation-delay: .15s; } .typing span:nth-child(3) { animation-delay: .3s; }
  .notice { font-size: 14px; color: var(--warn); background: var(--warn-soft); border-radius: 12px; padding: 10px 12px; }
  .closest { margin-top: 10px; font-size: 15px; }
  .closest .label { font-size: 12px; color: var(--muted); display: block; margin-bottom: 2px; }
  .closest mark, .passage mark { background: var(--mark); color: inherit; border-radius: 3px; padding: 0 1px; }

  .sources { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; align-items: center; }
  .src { display: inline-flex; align-items: center; gap: 6px; max-width: 100%; font-size: 12.5px; text-decoration: none;
         color: var(--text); background: var(--surface); border: 1px solid var(--border); border-radius: 999px; padding: 4px 10px 4px 4px; }
  .src:hover { border-color: var(--accent); }
  .src.flash { animation: flash 1.2s ease; }
  .src .n { flex: none; width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; font-size: 11px; font-weight: 700; }
  .src .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .src .pg { color: var(--faint); flex: none; }
  .msg-actions { display: flex; gap: 14px; margin-top: 8px; }
  .link-btn { border: 0; background: none; padding: 0; color: var(--muted); font-size: 12.5px; font-weight: 600;
              display: inline-flex; gap: 5px; align-items: center; text-decoration: none; }
  .link-btn:hover { color: var(--accent); }
  .passages { margin-top: 10px; display: grid; gap: 8px; }
  .passage { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 10px 12px; font-size: 13.5px; }
  .passage .ph { font-size: 12px; color: var(--muted); margin-bottom: 4px; font-weight: 600; }
  .passage .pt { white-space: pre-line; max-height: 220px; overflow: auto; }

  /* Composer */
  .composer-wrap { position: sticky; bottom: 0; padding: 10px 0 14px;
                   background: linear-gradient(180deg, transparent, var(--bg) 30%); }
  .composer { display: flex; align-items: flex-end; gap: 8px; background: var(--surface); border: 1px solid var(--border);
              border-radius: 18px; padding: 8px 8px 8px 10px; box-shadow: var(--shadow); transition: border-color .15s, box-shadow .15s; }
  .composer:focus-within { border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft), var(--shadow); }
  .composer select { flex: none; border: 1px solid var(--border); background: var(--surface-2); border-radius: 10px;
                     font-size: 13px; padding: 7px 8px; color: var(--muted); max-width: 150px; }
  .composer textarea { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; resize: none; font-size: 16px;
                       line-height: 1.45; padding: 7px 4px; max-height: 180px; }
  .composer textarea::placeholder { color: var(--faint); }
  .send { flex: none; width: 38px; height: 38px; border-radius: 12px; border: 0; display: grid; place-items: center;
          color: var(--on-accent); background: linear-gradient(135deg, var(--accent), var(--accent-2)); }
  .send:disabled { opacity: .4; cursor: not-allowed; }
  .send.stop { background: var(--text); color: var(--bg); }
  .fineprint { text-align: center; font-size: 12px; color: var(--faint); margin: 8px 0 0; }
  @media (max-width: 560px) { .composer select { display: none; } .composer { padding-left: 14px; } }

  /* Library panel */
  .library { position: sticky; top: 14px; margin-top: 8px; background: var(--surface); border: 1px solid var(--border);
             border-radius: 18px; box-shadow: var(--shadow); overflow: hidden; max-height: calc(100vh - 90px); display: flex; flex-direction: column; }
  .scrim { display: none; }
  @media (max-width: 1020px) {
    .library { position: fixed; z-index: 20; top: 0; right: 0; bottom: 0; width: min(360px, 92vw); max-height: none; margin: 0;
               border-radius: 18px 0 0 18px; transform: translateX(105%); transition: transform .2s ease; }
    .library.open { transform: none; }
    .scrim { display: block; position: fixed; inset: 0; z-index: 10; background: rgba(0,0,0,.35); }
  }
  .library-head { display: flex; align-items: center; gap: 8px; padding: 16px 18px 0; }
  .library-head h2 { margin: 0; font-size: 16px; flex: 1; }
  .library-head .count { font-size: 12px; color: var(--muted); }
  #docs-close { display: none; }
  @media (max-width: 1020px) { #docs-close { display: inline-grid; } }
  .dropzone { display: block; margin: 14px 18px 0; border: 1.5px dashed var(--border); border-radius: 14px; padding: 16px 14px;
              text-align: center; background: var(--surface-2); transition: border-color .15s, background .15s; cursor: pointer; }
  .dropzone:hover, .dropzone.over { border-color: var(--accent); background: var(--accent-soft); }
  .dropzone svg { color: var(--accent); }
  .dropzone strong { display: block; font-size: 14px; margin-top: 4px; }
  .dropzone span { font-size: 12px; color: var(--muted); }
  .upload-row { display: flex; gap: 8px; align-items: center; margin: 10px 18px 0; font-size: 13px; color: var(--muted); }
  .upload-row select { flex: 1; font-size: 13px; padding: 7px 10px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface); }
  .ocr-note { margin: 8px 18px 0; font-size: 12px; color: var(--warn); }
  .ocr-note code { background: var(--surface-2); padding: 1px 5px; border-radius: 5px; }
  .upload-log { margin: 10px 18px 0; display: grid; gap: 6px; }
  .upload-log:empty { display: none; }
  .upload-item { font-size: 12px; padding: 7px 10px; border-radius: 10px; background: var(--surface-2); display: flex; gap: 8px; align-items: flex-start; }
  .upload-item svg { flex: none; margin-top: 2px; }
  .upload-item .fname { font-weight: 600; overflow-wrap: anywhere; }
  .upload-item.added { background: var(--good-soft); color: var(--good); }
  .upload-item.duplicate { background: var(--warn-soft); color: var(--warn); }
  .upload-item.error { background: var(--bad-soft); color: var(--bad); }
  .spinner { width: 14px; height: 14px; border-radius: 50%; border: 2px solid currentColor; border-right-color: transparent;
             animation: spin .8s linear infinite; flex: none; margin-top: 1px; }
  .doc-groups { padding: 8px 10px 14px; margin-top: 8px; overflow-y: auto; flex: 1; }
  .group-title { display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 600; text-transform: uppercase;
                 letter-spacing: .05em; color: var(--muted); padding: 10px 8px 6px; }
  .group-title .dotc { width: 8px; height: 8px; border-radius: 50%; }
  .doc { display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: 10px; }
  .doc:hover { background: var(--surface-2); }
  .file-icon { flex: none; width: 32px; height: 32px; border-radius: 9px; display: grid; place-items: center; }
  .doc-info { min-width: 0; flex: 1; }
  .doc-info .name { font-size: 13px; font-weight: 600; overflow-wrap: anywhere; line-height: 1.3; }
  .doc-info .meta { font-size: 11px; color: var(--faint); }
  .doc .icon-btn { width: 28px; height: 28px; border-radius: 8px; }
  .doc .icon-btn.danger:hover { color: var(--bad); border-color: var(--bad); }
  .empty-lib { padding: 18px; font-size: 13px; color: var(--muted); text-align: center; }
  .error-text { color: var(--bad); }

  /* Page viewer: the source page with the passage and the answer's facts highlighted */
  .viewer { position: fixed; inset: 0; z-index: 40; display: grid; place-items: center; padding: 16px; background: rgba(10, 11, 16, .55); }
  .viewer-panel { width: min(920px, 100%); max-height: calc(100vh - 32px); display: flex; flex-direction: column;
                  background: var(--surface); border: 1px solid var(--border); border-radius: 18px; box-shadow: var(--shadow); overflow: hidden; }
  .viewer-head { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-bottom: 1px solid var(--border); }
  .viewer-title { flex: 1; min-width: 0; }
  .viewer-title .t { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: block; }
  .viewer-title .s { font-size: 12px; color: var(--muted); }
  .viewer-note { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; padding: 8px 14px; font-size: 13px;
                 color: var(--muted); border-bottom: 1px solid var(--border); background: var(--surface-2); }
  .viewer-note .key { display: inline-flex; align-items: center; gap: 6px; }
  .viewer-note .sw { width: 14px; height: 10px; border-radius: 3px; display: inline-block; }
  .viewer-note .sw.fact { background: rgba(255, 170, 0, .55); outline: 1.5px solid #f59e0b; }
  .viewer-note .sw.passage { background: rgba(255, 221, 87, .35); }
  .viewer-note strong { color: var(--text); font-weight: 600; }
  .viewer-body { overflow: auto; padding: 16px; background: var(--surface-2); flex: 1; }
  .page-wrap { position: relative; margin: 0 auto; max-width: 820px; background: #fff; box-shadow: 0 2px 12px rgba(0,0,0,.12); border-radius: 4px; }
  .page-wrap img { display: block; width: 100%; height: auto; border-radius: 4px; }
  .hl { position: absolute; border-radius: 2px; pointer-events: none; mix-blend-mode: multiply; }
  .hl.hl-passage { background: rgba(255, 221, 87, .35); }
  .hl.hl-fact { background: rgba(255, 170, 0, .5); box-shadow: 0 0 0 1.5px #f59e0b; animation: pulse 1.6s ease 2; }
  .page-text { max-width: 760px; margin: 0 auto; background: var(--surface); border-radius: 8px; padding: 20px 22px;
               white-space: pre-wrap; overflow-wrap: anywhere; font-size: 14.5px; line-height: 1.6; box-shadow: 0 2px 12px rgba(0,0,0,.08); }
  .page-text .tp-passage { background: rgba(255, 221, 87, .35); border-radius: 2px; }
  .page-text .tp-fact { background: rgba(255, 170, 0, .5); box-shadow: 0 0 0 1.5px #f59e0b; border-radius: 2px; }
  .viewer-loading { padding: 60px 0; text-align: center; color: var(--muted); }
  .pager { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
  .pager .icon-btn { width: 30px; height: 30px; }
  .pager .icon-btn:disabled { opacity: .35; cursor: not-allowed; }
  @media (max-width: 560px) {
    .viewer { padding: 0; } .viewer-panel { max-height: 100vh; height: 100vh; border-radius: 0; } .viewer-body { padding: 8px; }
    .page-wrap { width: 660px; max-width: none; }  /* readable size; the view scrolls to the highlight */
  }
  @keyframes pulse { 0%, 100% { box-shadow: 0 0 0 1.5px #f59e0b; } 50% { box-shadow: 0 0 0 5px rgba(245, 158, 11, .35); } }

  @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes blink { to { visibility: hidden; } }
  @keyframes bounce { 0%, 80%, 100% { transform: translateY(0); opacity: .5; } 40% { transform: translateY(-4px); opacity: 1; } }
  @keyframes flash { 0%, 100% { box-shadow: 0 0 0 0 transparent; } 30% { box-shadow: 0 0 0 4px var(--accent-soft); border-color: var(--accent); } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="logo" aria-hidden="true">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"><path d="M6 3h8l5 5v12a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z"/><path d="M14 3v5h5"/></svg>
    </span>
    <span class="name">Document Vault</span>
  </div>
  <div class="spacer"></div>
  <span class="pill" id="llm-pill" title="Checking the local AI model…"><span class="dot-s"></span><span id="llm-pill-text">Checking…</span></span>
  <span class="pill privacy"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>On this computer</span>
  <button class="btn" id="new-chat" type="button" title="Start a new chat">

<script>
const $ = (id) => document.getElementById(id);
const CATS = ["insurance", "warranty", "bill", "property", "other"];
const CAT_LABEL = { insurance: "Insurance", warranty: "Warranties", bill: "Bills", property: "Property", other: "Other" };
const SUGGESTIONS = [
  ["insurance", "When does my bike insurance expire?"],
  ["bill", "What is the electricity bill for August?"],
  ["warranty", "Find the washing machine warranty"],
  ["property", "What is the carpet area of our flat?"],
];
let info = null;
let history = [];       // [{role, content}] of this chat, sent with each question for follow-ups
let controller = null;  // AbortController of the answer being written

function el(tag, cls, text) {
  const node = document.createElement(tag);
  if (cls) node.className = cls;
  if (text !== undefined) node.textContent = text;
  return node;
}
// Only ever called with the fixed icon strings below, never with server data.
function svg(markup) { const t = document.createElement("template"); t.innerHTML = markup.trim(); return t.content.firstChild; }
const ICON = {
  file: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M6 3h8l5 5v12a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z"/><path d="M14 3v5h5"/></svg>',
  open: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6M20 4l-9 9"/><path d="M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>',
  trash: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>',
  ok: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  warn: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7.5v5.5M12 16.5v.5"/></svg>',
  send: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M6 11l6-6 6 6"/></svg>',
  stop: '<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><rect x="5" y="5" width="14" height="14" rx="2.5"/></svg>',
  close: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  bot: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"><path d="M6 3h8l5 5v12a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z"/><path d="M14 3v5h5"/></svg>',
  prev: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>',
  next: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>',
  logo: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M6 3h8l5 5v12a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z"/><path d="M14 3v5h5"/></svg>',
};
const displayName = (name) => name.replace(/_/g, "_​");  // let long file names wrap at underscores
const sentence = (m) => (/[.!?]$/.test(m.trim()) ? m.trim() : `${m.trim()}.`);
function catColor(node, cat) { node.style.color = `var(--c-${cat})`; node.style.background = `var(--c-${cat}-soft)`; return node; }
function fileIcon(cat) { const d = catColor(el("span", "file-icon"), cat); d.append(svg(ICON.file)); return d; }
function fileUrl(docId, filename, page) {
  const url = `/api/documents/${encodeURIComponent(docId)}/file`;
  return /\.pdf$/i.test(filename) && page ? `${url}#page=${page}` : url;
}
$("docs-close").append(svg(ICON.close));

/* ---------- theme ---------- */
const THEMES = ["system", "light", "dark"];
const THEME_ICON = {
  system: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>',
  light: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
  dark: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>',
};
let theme = "system";
try { theme = localStorage.getItem("theme") || "system"; } catch (e) {}
if (!THEMES.includes(theme)) theme = "system";
function applyTheme() {
  if (theme === "system") document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme", theme);
  $("theme").replaceChildren(svg(THEME_ICON[theme]));
  $("theme").title = `Theme: ${theme}`;
}
applyTheme();
$("theme").onclick = () => {
  theme = THEMES[(THEMES.indexOf(theme) + 1) % THEMES.length];
  applyTheme();
  try { localStorage.setItem("theme", theme); } catch (e) {}
};

/* ---------- library panel ---------- */
function openDocs(open) {
  $("library").classList.toggle("open", open);
  $("scrim").hidden = !open;
}
$("docs-toggle").onclick = () => openDocs(true);
$("docs-close").onclick = () => openDocs(false);
$("scrim").onclick = () => openDocs(false);

async function refreshLibrary() {
  const [infoRes, docsRes] = await Promise.all([fetch("/api/info"), fetch("/api/documents")]);
  info = await infoRes.json();
  const docs = await docsRes.json();
  $("lib-count").textContent = `${docs.length} ${docs.length === 1 ? "document" : "documents"}`;
  $("ocr-note").hidden = info.ocr_available;
  $("types-hint").textContent = info.ocr_available
    ? `PDF, Word, text, or photos · up to ${info.max_upload_mb} MB`
    : `PDF, Word or text files · up to ${info.max_upload_mb} MB`;
  renderStatus();
  renderDocs(docs);
  if (!history.length && !controller && !$("thread").querySelector(".msg")) renderWelcome();
}

function renderStatus() {
  const st = info && info.llm_status;
  if (!st) return;
  const pill = $("llm-pill");
  pill.className = `pill ${st.ready ? "ready" : "not-ready"}`;
  $("llm-pill-text").textContent = st.ready ? "Assistant ready" : "Assistant offline";
  pill.title = st.message;
}

function renderDocs(docs) {
  const box = $("doc-groups");
  if (!docs.length) {
    box.replaceChildren(el("div", "empty-lib", "No documents yet. Upload your first policy, warranty card or bill above."));
    return;
  }
  const groups = CATS.map((cat) => [cat, docs.filter((d) => d.category === cat)]).filter(([, list]) => list.length);
  box.replaceChildren(...groups.flatMap(([cat, list]) => {
    const title = el("div", "group-title");
    const dot = el("span", "dotc");
    dot.style.background = `var(--c-${cat})`;
    title.append(dot, `${CAT_LABEL[cat]} · ${list.length}`);
    return [title, ...list.map(renderDoc)];
  }));
}

function renderDoc(d) {
  const row = el("div", "doc");
  const infoBox = el("div", "doc-info");
  const added = new Date(d.added_at).toLocaleDateString(undefined, { day: "numeric", month: "short", year: "numeric" });
  const pages = `${d.pages} ${d.pages === 1 ? "page" : "pages"}`;
  infoBox.append(el("div", "name", displayName(d.filename)), el("div", "meta", `${pages} · added ${added}${d.ocr_pages ? " · scanned" : ""}`));
  const open = el("a", "icon-btn");
  open.href = fileUrl(d.doc_id, d.filename); open.target = "_blank"; open.rel = "noopener";
  open.title = "Open"; open.setAttribute("aria-label", `Open ${d.filename}`); open.append(svg(ICON.open));
  const del = el("button", "icon-btn danger");
  del.type = "button"; del.title = "Remove from vault"; del.setAttribute("aria-label", `Remove ${d.filename}`);
  del.append(svg(ICON.trash));
  del.onclick = async () => {
    if (!confirm(`Remove "${d.filename}" from the vault?\n\nThe copy on your computer outside this app is not affected.`)) return;
    await fetch(`/api/documents/${encodeURIComponent(d.doc_id)}`, { method: "DELETE" });
    await refreshLibrary();
  };
  row.append(fileIcon(d.category), infoBox, open, del);
  return row;
}

async function uploadFiles(fileList) {
  const files = [...fileList];
  if (!files.length) return;
  const log = $("upload-log");
  const pending = el("div", "upload-item");
  pending.append(el("span", "spinner"), el("span", null, `Reading and indexing ${files.length} ${files.length === 1 ? "file" : "files"}…`));
  log.replaceChildren(pending);
  const form = new FormData();
  files.forEach((f) => form.append("files", f));
  form.append("category", $("upload-category").value);
  try {
    const res = await fetch("/api/documents", { method: "POST", body: form });
    const data = await res.json();
    if (!res.ok) throw new Error(typeof data.detail === "string" ? data.detail : res.statusText);
    log.replaceChildren(...data.map((r) => {
      const item = el("div", `upload-item ${r.status}`);
      const body = el("span");
      const msg = r.status === "added" ? ` added to ${r.document.category}`
        : r.status === "duplicate" ? " is already in the vault" : `: ${r.error}`;
      body.append(el("span", "fname", r.filename), msg);
      item.append(svg(r.status === "error" ? ICON.warn : ICON.ok), body);
      return item;
    }));
  } catch (e) {
    log.replaceChildren(el("div", "upload-item error", `Upload failed: ${e.message}`));
  }
  $("file-input").value = "";
  await refreshLibrary();
}
$("file-input").onchange = (e) => uploadFiles(e.target.files);
const dz = $("dropzone");
["dragenter", "dragover"].forEach((t) => dz.addEventListener(t, (e) => { e.preventDefault(); dz.classList.add("over"); }));
["dragleave", "drop"].forEach((t) => dz.addEventListener(t, (e) => { e.preventDefault(); dz.classList.remove("over"); }));
dz.addEventListener("drop", (e) => uploadFiles(e.dataTransfer.files));

/* ---------- chat ---------- */
function renderWelcome() {
  const w = el("section", "welcome");
  const logo = el("span", "big-logo"); logo.append(svg(ICON.logo));
  const empty = info && info.num_documents === 0;
  w.append(logo, el("h1", null, "What would you like to know?"),
    el("p", null, empty
      ? "Your vault is empty. Upload policies, warranty cards, bills or property papers in Documents, then ask me anything about them."
      : `Ask me anything about your ${info ? info.num_documents + " " : ""}documents: expiry dates, amounts, policy numbers, warranties.`));
  const st = info && info.llm_status;
  if (st && !st.ready) {
    const box = el("div", "setup");
    box.append(svg(ICON.warn), el("span", null, `${sentence(st.message)} Until then I can only point you to the closest line in your documents.`));
    w.append(box);
  }
  const grid = el("div", "suggestions");
  SUGGESTIONS.forEach(([cat, q]) => {
    const b = el("button", "suggestion");
    b.type = "button";
    b.append(el("small", null, cat), q);
    b.onclick = () => ask(q);
    grid.append(b);
  });
  w.append(grid);
  $("thread").replaceChildren(w);
}

function scrollToBottom() { window.scrollTo({ top: document.body.scrollHeight }); }

function addUserMessage(text) {
  const m = el("div", "msg user");
  m.append(el("div", "bubble", text));
  $("thread").append(m);
}

function addBotMessage() {
  const m = el("div", "msg bot");
  const avatar = el("span", "avatar"); avatar.append(svg(ICON.bot));
  const body = el("div", "body");
  const content = el("div", "content");
  const typing = el("span", "typing"); typing.append(el("span"), el("span"), el("span"));
  content.append(typing);
  body.append(content);
  m.append(avatar, body);
  $("thread").append(m);
  return { body, content };
}

// Citations are shown renumbered per reply (1, 2, ...) in order of first mention,
// however the retrieved passages happened to be numbered.
function citationOrder(text, numSources) {
  const order = [];
  for (const m of text.matchAll(/\[(\d+)\]/g)) {
    const n = Number(m[1]);
    if (n >= 1 && n <= numSources && !order.includes(n)) order.push(n);
  }
  return order;
}

// Minimal, safe formatting for model output: paragraphs, "- " / "1. " lists, **bold**, and [n] citations.
function renderInline(parent, text, onCite) {
  const re = /(\*\*[^*]+\*\*|\[\d+\])/g;
  let last = 0;
  for (const m of text.matchAll(re)) {
    if (m.index > last) parent.append(text.slice(last, m.index));
    const token = m[0];
    if (token.startsWith("**")) parent.append(el("strong", null, token.slice(2, -2)));
    else {
      const n = Number(token.slice(1, -1));
      const shown = onCite.label(n);
      if (shown) {
        const b = el("button", "cite", String(shown));
        b.type = "button"; b.title = `Source ${shown}`;
        b.onclick = () => onCite(n);
        parent.append(b);
      }  // a citation to a passage that doesn't exist is dropped
    }
    last = m.index + token.length;
  }
  if (last < text.length) parent.append(text.slice(last));
}
function renderMarkdown(container, text, onCite, streaming) {
  container.replaceChildren();
  text.trim().split(/\n\s*\n/).forEach((block) => {
    const lines = block.split("\n").filter((l) => l.trim());
    const isList = lines.length && lines.every((l) => /^\s*([-*•]|\d+[.)])\s+/.test(l));
    if (isList) {
      const list = el(/^\s*\d/.test(lines[0]) ? "ol" : "ul");
      lines.forEach((l) => { const li = el("li"); renderInline(li, l.replace(/^\s*([-*•]|\d+[.)])\s+/, ""), onCite); list.append(li); });
      container.append(list);
    } else {
      const p = el("p");
      renderInline(p, lines.join("\n"), onCite);
      container.append(p);
    }
  });
  if (streaming) {
    let last = container.lastElementChild || container;
    if (last.tagName === "UL" || last.tagName === "OL") last = last.lastElementChild;
    last.append(el("span", "caret"));
  }
}

const STOPWORDS = new Set(("the a an of in on at to for and or is are was were be by with from as that this what who whom when " +
  "where which why how does did do its it into than then my our we us me find much many month").split(" "));
function termRegex(q) {
  const terms = [...new Set(q.toLowerCase().match(/[\p{L}\p{N}]+/gu) || [])].filter((w) => w.length > 2 && !STOPWORDS.has(w));
  return terms.length ? new RegExp(`\\b(${terms.map((t) => t.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).join("|")})`, "giu") : null;
}
function fillHighlighted(node, text, re) {
  if (!re) { node.append(text); return; }
  let last = 0;
  for (const m of text.matchAll(re)) {
    if (m.index > last) node.append(text.slice(last, m.index));
    node.append(el("mark", null, m[0]));
    last = m.index + m[0].length;
  }
  if (last < text.length) node.append(text.slice(last));
}
// Used only when the assistant can't answer: the line sharing the most words with the question.
function closestLine(sources, question) {
  const re = termRegex(question);
  if (!re) return null;
  let best = null, bestHits = 0;
  for (const s of sources.slice(0, 3)) {
    for (const raw of s.text.split("\n")) {
      const line = raw.trim();
      if (!line || /^SAMPLE DOCUMENT/i.test(line)) continue;
      const count = new Set((line.match(re) || []).map((w) => w.toLowerCase())).size;
      if (count > bestHits) { best = { line: line.replace(/^#+\s*/, ""), source: s }; bestHits = count; }
    }
  }
  return best;
}

function renderSources(body, sources, citations, question, answer) {
  if (!sources.length) return;
  if (citations.length) {
    const row = el("div", "sources");
    citations.forEach((n, i) => {
      const s = sources[n - 1];
      const a = el("a", "src");
      a.id = `${body.dataset.id}-src-${n}`;
      a.href = fileUrl(s.doc_id, s.filename, s.page); a.target = "_blank"; a.rel = "noopener";
      a.title = `Show ${s.filename}, page ${s.page}, with the answer highlighted`;
      a.onclick = (e) => {  // plain click: highlighted view; Cmd/Ctrl-click still opens the original in a new tab
        if (e.metaKey || e.ctrlKey || e.shiftKey || e.button !== 0) return;
        e.preventDefault();
        openViewer(s, answer);
      };
      a.append(catColor(el("span", "n", String(i + 1)), s.category), el("span", "t", s.filename), el("span", "pg", `p. ${s.page}`));
      row.append(a);
    });
    body.append(row);
  }
  const shown = citations.length ? citations : sources.map((_, i) => i + 1);
  const label = citations.length ? "Show where this came from" : "Show related passages";
  const passages = el("div", "passages"); passages.hidden = true;
  const re = termRegex(question);
  shown.forEach((n) => {
    const s = sources[n - 1];
    const box = el("div", "passage");
    const pt = el("div", "pt");
    fillHighlighted(pt, s.text, re);
    box.append(el("div", "ph", `${citations.length ? `[${shown.indexOf(n) + 1}] ` : ""}${s.filename} · page ${s.page}`), pt);
    passages.append(box);
  });
  const toggle = el("button", "link-btn", label);
  toggle.type = "button";
  toggle.onclick = () => { passages.hidden = !passages.hidden; toggle.textContent = passages.hidden ? label : "Hide passages"; };
  const actions = el("div", "msg-actions");
  actions.append(toggle);
  body.append(actions, passages);
}

/* ---------- page viewer ---------- */
const viewer = { source: null, answer: "", page: 1, pages: 1, seq: 0, returnFocus: null };
$("viewer-close").append(svg(ICON.close));
$("viewer-open").prepend(svg(ICON.open));
$("viewer-prev").append(svg(ICON.prev));
$("viewer-next").append(svg(ICON.next));

function openViewer(source, answer) {
  Object.assign(viewer, { source, answer: answer || "", page: source.page, pages: 1, returnFocus: document.activeElement });
  $("viewer-name").textContent = source.filename;
  $("viewer-icon").replaceChildren(fileIcon(source.category));
  $("viewer-open").href = fileUrl(source.doc_id, source.filename, source.page);
  $("viewer").hidden = false;
  document.body.style.overflow = "hidden";
  $("viewer-close").focus();
  showViewerPage();
}
function closeViewer() {
  if ($("viewer").hidden) return;
  $("viewer").hidden = true;
  document.body.style.overflow = "";
  viewer.seq++;
  if (viewer.returnFocus) viewer.returnFocus.focus();
}
$("viewer-close").onclick = closeViewer;
$("viewer").addEventListener("click", (e) => { if (e.target === $("viewer")) closeViewer(); });
$("viewer-prev").onclick = () => { if (viewer.page > 1) { viewer.page--; showViewerPage(); } };
$("viewer-next").onclick = () => { if (viewer.page < viewer.pages) { viewer.page++; showViewerPage(); } };

function viewerNote(h, onSourcePage) {
  const note = $("viewer-note");
  note.replaceChildren();
  const swatch = (cls, label) => { const k = el("span", "key"); k.append(el("span", `sw ${cls}`), label); return k; };
  if (h.kind === "image" || h.scanned) {
    note.append(onSourcePage ? "This page is a scan or photo, so it can't be highlighted yet. The passage used is shown in the chat."
                             : "Scanned page.");
  } else if (!onSourcePage) {
    note.append(`Page ${h.page}. The answer came from page ${viewer.source.page}.`);
  } else {
    if (h.facts_found.length) {
      const k = swatch("fact", "Answer: ");
      k.append(el("strong", null, h.facts_found.join(" · ")));
      note.append(k);
    }
    if (h.passage_found) note.append(swatch("passage", "Passage the answer used"));
    if (h.facts_missing.length && !h.facts_found.length) {
      note.append(el("span", null, "The answer's exact wording wasn't found on this page, so check the highlighted passage."));
    }
    if (!h.passage_found && !h.facts_found.length) note.append("Nothing to highlight on this page.");
  }
  note.hidden = !note.childNodes.length;
}

function renderTextPage(h) {
  // Build segments over the page text: plain / passage / fact (facts win where they overlap).
  const text = h.text || "";
  const level = new Uint8Array(text.length);
  (h.passage || []).forEach(([s, e]) => level.fill(1, s, e));
  (h.facts || []).forEach(([s, e]) => level.fill(2, s, e));
  const box = el("div", "page-text");
  let i = 0;
  while (i < text.length) {
    let j = i;
    while (j < text.length && level[j] === level[i]) j++;
    const piece = text.slice(i, j);
    box.append(level[i] === 0 ? piece : el("span", level[i] === 2 ? "tp-fact" : "tp-passage", piece));
    i = j;
  }
  return box;
}

async function showViewerPage() {
  const seq = ++viewer.seq;
  const { source } = viewer;
  const onSourcePage = viewer.page === source.page;
  const body = $("viewer-body");
  body.replaceChildren(el("div", "viewer-loading", "Loading page…"));
  $("viewer-note").hidden = true;
  $("viewer-sub").textContent = `${CAT_LABEL[source.category] || source.category} · page ${viewer.page}`;
  let h;
  try {
    const res = await fetch(`/api/documents/${encodeURIComponent(source.doc_id)}/pages/${viewer.page}/highlights`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(onSourcePage ? { chunk_id: source.chunk_id, answer: viewer.answer } : {}),
    });
    h = await res.json();
    if (!res.ok) throw new Error(typeof h.detail === "string" ? h.detail : res.statusText);
  } catch (e) {
    if (seq === viewer.seq) body.replaceChildren(el("div", "viewer-loading error-text", `Couldn't show this page: ${e.message}`));
    return;
  }
  if (seq !== viewer.seq) return;
  viewer.pages = h.pages || 1;
  $("viewer-pager").hidden = viewer.pages < 2;
  $("viewer-pageno").textContent = `${viewer.page} / ${viewer.pages}`;
  $("viewer-prev").disabled = viewer.page <= 1;
  $("viewer-next").disabled = viewer.page >= viewer.pages;
  $("viewer-open").href = fileUrl(source.doc_id, source.filename, viewer.page);
  viewerNote(h, onSourcePage);

  if (h.kind === "text") {
    body.replaceChildren(renderTextPage(h));
    const first = body.querySelector(".tp-fact") || body.querySelector(".tp-passage");
    if (first) first.scrollIntoView({ block: "center" });
    return;
  }
  const wrap = el("div", "page-wrap");
  const img = el("img");
  img.alt = `${source.filename}, page ${viewer.page}`;
  img.src = h.kind === "image" ? fileUrl(source.doc_id, source.filename)
    : `/api/documents/${encodeURIComponent(source.doc_id)}/pages/${viewer.page}/image`;
  wrap.append(img);
  if (h.kind === "pdf") {
    const box = (cls, [x, y, w, hh]) => {
      const d = el("div", `hl ${cls}`);
      Object.assign(d.style, { left: `${(x / h.width) * 100}%`, top: `${(y / h.height) * 100}%`,
                               width: `${(w / h.width) * 100}%`, height: `${(hh / h.height) * 100}%` });
      return d;
    };
    (h.passage || []).forEach((r) => wrap.append(box("hl-passage", r)));
    (h.facts || []).forEach((r) => wrap.append(box("hl-fact", r)));
  }
  body.replaceChildren(wrap);
  img.onload = () => {
    if (seq !== viewer.seq) return;
    const target = wrap.querySelector(".hl-fact") || wrap.querySelector(".hl-passage");
    if (target) {
      body.scrollTop = Math.max(0, target.offsetTop - body.clientHeight / 3);
      body.scrollLeft = Math.max(0, target.offsetLeft - body.clientWidth / 4);
    }
  };
}

let msgCounter = 0;
async function ask(question) {
  question = question.trim();
  if (!question || controller) return;
  if (!history.length) $("thread").replaceChildren();
  addUserMessage(question);
  const { body, content } = addBotMessage();
  body.dataset.id = `m${++msgCounter}`;
  let sources = [], text = "", done = null, error = null;
  const onCite = (n) => { if (sources[n - 1]) openViewer(sources[n - 1], text); };
  onCite.label = (n) => { const i = citationOrder(text, sources.length).indexOf(n); return i >= 0 ? i + 1 : null; };
  controller = new AbortController();
  setBusy(true);
  scrollToBottom();

  try {
    if (info && info.num_documents === 0) {
      error = "Your vault is empty. Open Documents and upload a policy, warranty card or bill first, then ask again";
    } else {
      const res = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ question, history: history.slice(-6), category: $("category").value || null }),
        signal: controller.signal,
      });
      if (!res.ok) {
        const data = await res.json().catch(() => ({}));
        error = typeof data.detail === "string" ? data.detail : `Something went wrong (${res.status})`;
      } else {
        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let buffer = "";
        for (;;) {
          const { value, done: finished } = await reader.read();
          if (finished) break;
          buffer += decoder.decode(value, { stream: true });
          const lines = buffer.split("\n");
          buffer = lines.pop();
          for (const line of lines) {
            if (!line.trim()) continue;
            const ev = JSON.parse(line);
            if (ev.type === "sources") sources = ev.sources;
            else if (ev.type === "token") { text += ev.text; renderMarkdown(content, text, onCite, true); scrollToBottom(); }
            else if (ev.type === "done") done = ev;
            else if (ev.type === "error") error = ev.message;
          }
        }
      }
    }
  } catch (e) {
    if (e.name !== "AbortError") error = `Couldn't reach the vault: ${e.message}`;
    else if (!text) text = "Stopped.";
  }

  if (text) renderMarkdown(content, text, onCite, false);
  else content.replaceChildren();
  if (error) {
    content.append(el("div", "notice", sentence(error)));
    const hit = closestLine(sources, question);
    if (hit) {
      const c = el("div", "closest");
      c.append(el("span", "label", `Closest line in ${hit.source.filename}, page ${hit.source.page} (not an AI answer):`));
      const line = el("span"); fillHighlighted(line, hit.line, termRegex(question)); c.append(line);
      content.append(c);
    }
    refreshLibrary().catch(() => {});
  }
  renderSources(body, sources, done ? citationOrder(text, sources.length) : [], question, done ? text : "");
  if (text && !error && done) history.push({ role: "user", content: question }, { role: "assistant", content: text });
  controller = null;
  setBusy(false);
  scrollToBottom();
}

/* ---------- composer ---------- */
const input = $("q");
function setBusy(busy) {
  const send = $("send");
  send.classList.toggle("stop", busy);
  send.replaceChildren(svg(busy ? ICON.stop : ICON.send));
  send.setAttribute("aria-label", busy ? "Stop" : "Send");
  send.disabled = !busy && !input.value.trim();
}
function autosize() { input.style.height = "auto"; input.style.height = `${Math.min(input.scrollHeight, 180)}px`; }
input.addEventListener("input", () => { autosize(); if (!controller) $("send").disabled = !input.value.trim(); });
input.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); $("composer").requestSubmit(); }
});
$("composer").onsubmit = (e) => {
  e.preventDefault();
  if (controller) { controller.abort(); return; }
  const q = input.value;
  if (!q.trim()) return;
  input.value = ""; autosize();
  ask(q);
};
$("new-chat").onclick = () => {
  if (controller) controller.abort();
  history = [];
  renderWelcome();
  input.focus();
};
document.addEventListener("keydown", (e) => {
  const typing = ["INPUT", "SELECT", "TEXTAREA"].includes(document.activeElement.tagName);
  if (e.key === "/" && !typing) { e.preventDefault(); input.focus(); }
  if (e.key === "Escape") { if (!$("viewer").hidden) closeViewer(); else openDocs(false); }
});
setBusy(false);
renderWelcome();
refreshLibrary().catch(() => { $("doc-groups").replaceChildren(el("div", "empty-lib error-text", "Could not reach the server.")); });
input.focus();
</script>
