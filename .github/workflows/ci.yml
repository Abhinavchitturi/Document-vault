name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q
      - name: The pinned llama.cpp build downloads, checks out and runs here
        shell: bash
        run: |
          python -c "from backend.llm import setup; setup.install_server()"
          "$(python -c 'from backend.llm import llamacpp; print(llamacpp.server_path())')" --version

  windows-vault:
    # Starts the real vault on real Windows through the same commands a person uses, then stops it.
    name: Windows start / stop
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: python -m pip install -r requirements.txt
      - run: npm ci && npm run build
        working-directory: frontend
      - name: The installer script is valid PowerShell
        shell: powershell
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD\install.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $errors | ForEach-Object { Write-Error $_.Message }; exit 1 }
      - name: Start, check, stop
        shell: pwsh
        run: |
          cmd /c "vault.cmd start"; if ($LASTEXITCODE) { exit 1 }
          Invoke-WebRequest http://localhost:8000/api/auth/status -UseBasicParsing | Out-Null
          cmd /c "vault.cmd status"; if ($LASTEXITCODE) { exit 1 }
          cmd /c "vault.cmd stop"; if ($LASTEXITCODE) { exit 1 }
          Start-Sleep -Seconds 2
          $up = $true
          try { Invoke-WebRequest http://localhost:8000/api/auth/status -UseBasicParsing -TimeoutSec 3 | Out-Null } catch { $up = $false }
          if ($up) { Write-Error "the vault is still running after vault stop"; exit 1 }
          "stopped as expected"
          exit 0
      - name: Log, if it went wrong
        if: failure()
        shell: cmd
        run: type data\logs\vault.log

  installer:
    name: Windows installer
    runs-on: windows-latest
    permissions:
      contents: write  # to attach the installer to a release
    steps:
      - uses: actions/checkout@v4
      - name: Build DocumentVault-Setup.exe
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
          $version = if ($env:GITHUB_REF -like 'refs/tags/v*') { $env:GITHUB_REF_NAME.TrimStart('v') } else { "0.0.0-dev" }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DVersion=$version" packaging\windows\DocumentVault.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - uses: actions/upload-artifact@v4
        with:
          name: DocumentVault-Setup
          path: dist/DocumentVault-Setup.exe
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: gh release upload "$env:GITHUB_REF_NAME" dist/DocumentVault-Setup.exe --clobber
        env:
          GH_TOKEN: ${{ github.token }}

  mac-app:
    name: Mac app (.dmg)
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Build DocumentVault-macOS.dmg
        run: |
          case "$GITHUB_REF" in refs/tags/v*) version="${GITHUB_REF_NAME#v}" ;; *) version="0.0.0-dev" ;; esac
          sh packaging/macos/build_dmg.sh "$version"
      - uses: actions/upload-artifact@v4
        with:
          name: DocumentVault-macOS
          path: dist/DocumentVault-macOS.dmg
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        run: gh release upload "$GITHUB_REF_NAME" dist/DocumentVault-macOS.dmg --clobber
        env:
          GH_TOKEN: ${{ github.token }}

  windows-native:
    # The native Windows app (WinUI 3): its core against the real engine, a build, and a screenshot of it running.
    name: Windows app (WinUI)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Core tests, against the real engine over the pipe
        shell: pwsh
        run: |
          $env:VAULT_TEST_PYTHON = (Get-Command python).Source
          dotnet test apps/windows/DocumentVault.Core.Tests
      - name: Build the app
        run: dotnet publish apps/windows/DocumentVault.App -c Release -r win-x64 -p:Platform=x64 -o dist/windows-app
      - name: Open it and take a screenshot
        shell: pwsh
        run: |
          $env:DOCUMENT_VAULT_DIR = "$PWD"
          $env:DOCUMENT_VAULT_PYTHON = (Get-Command python).Source
          $app = Start-Process dist/windows-app/DocumentVault.exe -PassThru
          Start-Sleep -Seconds 90
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $shot = New-Object System.Drawing.Bitmap $bounds.Width, $bounds.Height
          [System.Drawing.Graphics]::FromImage($shot).CopyFromScreen($bounds.Location, [System.Drawing.Point]::Empty, $bounds.Size)
          $shot.Save("$PWD/windows-app.png")
          if ($app.HasExited) { Write-Error "The app quit by itself (code $($app.ExitCode))"; exit 1 }
          Stop-Process -Id $app.Id
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DocumentVault-Windows-app
          path: |
            dist/windows-app
            windows-app.png
            data/logs
          if-no-files-found: ignore

  mac-native:
    # The native Mac app (SwiftUI), built with GitHub's Xcode.
    name: Mac app (SwiftUI)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: VaultKit tests
        run: cd apps/apple/VaultKit && swift test
      - name: Build Document Vault.app
        run: sh apps/apple/macOS/build_app.sh
      - name: Zip it
        run: cd "apps/apple/macOS/build" && ditto -c -k --keepParent "Document Vault.app" ../../../../DocumentVault-Mac-app.zip
      - uses: actions/upload-artifact@v4
        with:
          name: DocumentVault-Mac-app
          path: DocumentVault-Mac-app.zip
