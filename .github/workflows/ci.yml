name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Put the installers on this release (for example v0.9.2); empty: don't"
        required: false
        default: ""
      full_tests:
        description: "Test everything first (big features). Off: just build and release."
        type: boolean
        required: false
        default: false

# A newer push makes the check run of an older one pointless: it stops by itself. Release builds (started by hand
# with a release name) are never cut short.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || 'checks' }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (${{ matrix.os }})
    if: github.event_name != 'workflow_dispatch' || inputs.full_tests  # a release without full tests skips it (checks on every push still run)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25  # usually 2-8; a hang fails fast
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: "Install the packages"
        run: python -m pip install -r requirements.txt
      - run: python -m pytest -q --durations=15  # lists the slowest tests, to speed them up
      - name: "Two real vaults kept as one: joining with a code, both ways, deletions, catching up (1.0)"
        if: runner.os == 'Linux'
        run: python tests/sync_two_vaults.py
      - name: The pinned llama.cpp build downloads, checks out and runs here
        shell: bash
        run: |
          python -c "from backend.llm import setup; setup.install_server()"
          "$(python -c 'from backend.llm import llamacpp; print(llamacpp.server_path())')" --version

  windows-vault:
    # Starts the real vault on real Windows through the same commands a person uses, then stops it.
    name: Windows start / stop
    if: github.event_name != 'workflow_dispatch' || inputs.full_tests
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: python -m pip install -r requirements.txt
      - run: npm ci && npm run build
        working-directory: frontend
      - name: The installer script is valid PowerShell
        shell: powershell
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD\install.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $errors | ForEach-Object { Write-Error $_.Message }; exit 1 }
      - name: Start, check, stop
        shell: pwsh
        run: |
          cmd /c "vault.cmd start"; if ($LASTEXITCODE) { exit 1 }
          Invoke-WebRequest http://localhost:8000/api/auth/status -UseBasicParsing | Out-Null
          cmd /c "vault.cmd status"; if ($LASTEXITCODE) { exit 1 }
          cmd /c "vault.cmd stop"; if ($LASTEXITCODE) { exit 1 }
          Start-Sleep -Seconds 2
          $up = $true
          try { Invoke-WebRequest http://localhost:8000/api/auth/status -UseBasicParsing -TimeoutSec 3 | Out-Null } catch { $up = $false }
          if ($up) { Write-Error "the vault is still running after vault stop"; exit 1 }
          "stopped as expected"
          exit 0
      - name: Log, if it went wrong
        if: failure()
        shell: cmd
        run: type data\logs\vault.log

  mac-app:
    name: Mac app (.dmg)
    runs-on: macos-latest
    timeout-minutes: 40  # 3 minutes with an unchanged engine, ~12 when it is built again
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Build DocumentVault-macOS.dmg (just the app) and the engine it downloads when the Mac keeps the vault
        env:
          GH_TOKEN: ${{ github.token }}  # to reuse an engine already on a release
        run: |
          sh packaging/macos/build_dmg.sh "${{ inputs.release || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || 'v0.0.0-dev' }}"
          ls -lh dist/DocumentVault-macOS.dmg dist/DocumentVault-Engine-macOS-*.tar.xz
      - name: Open the DMG, set up the engine like the app does (check its SHA-256, unpack), and add the samples with it
        if: github.event_name != 'workflow_dispatch' || inputs.full_tests
        run: |
          hdiutil attach -nobrowse -mountpoint "$RUNNER_TEMP/dmg" dist/DocumentVault-macOS.dmg
          ditto "$RUNNER_TEMP/dmg/Document Vault.app" "$RUNNER_TEMP/Applications/Document Vault.app"
          hdiutil detach "$RUNNER_TEMP/dmg"
          app="$RUNNER_TEMP/Applications/Document Vault.app"
          codesign --verify "$app"
          want=$(python3 -c "import json,sys; print(json.load(open(sys.argv[1]))['sha256'])" "$app/Contents/Resources/engine.json")
          got=$(shasum -a 256 dist/DocumentVault-Engine-macOS-*.tar.xz | cut -d' ' -f1)
          [ "$want" = "$got" ] || { echo "engine.json doesn't describe this engine"; exit 1; }
          engine="$RUNNER_TEMP/Engine" && mkdir -p "$engine" && /usr/bin/tar -xJf dist/DocumentVault-Engine-macOS-*.tar.xz -C "$engine"
          mkdir -p "$RUNNER_TEMP/vault" && cd "$RUNNER_TEMP/vault"
          export PYTHONPATH="$app/Contents/Resources" VAULT_RUNTIME="$engine" PYTHONNOUSERSITE=1 PYTHONDONTWRITEBYTECODE=1 VAULT_KEYCHAIN=off
          export VAULT_KEY_DIR="$RUNNER_TEMP/keys" VAULT_DATABASE_URL="sqlite:///data/index/vault.db"
          "$engine/python/bin/python3" -c "from backend.parser import ocr; p = ocr.tesseract_path(); print(p); assert '/Engine/' in p"
          "$engine/python/bin/python3" -m backend.upload.ingest "$GITHUB_WORKSPACE/samples/pdfs" "$GITHUB_WORKSPACE/samples/scans" --owner abhinav
      - uses: actions/upload-artifact@v4
        with:
          name: DocumentVault-macOS
          path: dist/DocumentVault-macOS.dmg
      - name: Attach to the release (only after the DMG and the engine passed the test above)
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release != ''
        run: |
          files="dist/DocumentVault-macOS.dmg"
          [ -f dist/engine-to-upload.txt ] && files="$files $(cat dist/engine-to-upload.txt)"  # a new engine only
          gh release upload "${{ inputs.release || github.ref_name }}" $files --clobber
        env:
          GH_TOKEN: ${{ github.token }}

  windows-native:
    # The native Windows app (WinUI 3): its core against the real engine, a build, and a screenshot of it running.
    name: Windows app (WinUI)
    runs-on: windows-latest
    timeout-minutes: 45  # usually ~15 with the scenarios: a hang fails fast
    env:
      VAULT_AI_AUTO_DOWNLOAD: "0"  # the engines started here (tests, the installed app) don't need the 5 GB AI
    permissions:
      contents: write  # to attach the installer to a release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements.txt  # for the tests
        if: github.event_name != 'workflow_dispatch' || inputs.full_tests
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Core tests, against the real engine over the pipe
        if: github.event_name != 'workflow_dispatch' || inputs.full_tests
        shell: pwsh
        run: |
          $env:VAULT_TEST_PYTHON = (Get-Command python).Source
          dotnet test apps/windows/DocumentVault.Core.Tests
      - name: Build the app
        shell: pwsh
        run: |
          $version = "${{ inputs.release || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || 'v0.0.0-dev' }}".TrimStart('v')
          dotnet publish apps/windows/DocumentVault.App -c Release -r win-x64 -p:Platform=x64 "-p:Version=$version" -o dist/windows-app
      - name: Build the engine, downloaded by the app only on a PC that keeps the vault (a private Python, the vault's packages, Tesseract)
        shell: pwsh
        run: ./packaging/windows/build_engine.ps1 -Out dist\engine -Tag "${{ inputs.release || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || 'v0.0.0-dev' }}" -AppDir dist\windows-app
        env:
          GH_TOKEN: ${{ github.token }}  # to reuse an engine already on a release
      - name: Build DocumentVault-Setup.exe (just the app)
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
          $version = "${{ inputs.release || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || 'v0.0.0-dev' }}".TrimStart('v')
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DVersion=$version" packaging\windows\DocumentVault.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - uses: actions/upload-artifact@v4
        with:
          name: DocumentVault-Setup
          path: dist/DocumentVault-Setup.exe
      - name: Install it, like a person would (no Python, Git or Node from this machine is used)
        if: github.event_name != 'workflow_dispatch' || inputs.full_tests
        shell: pwsh
        run: |
          Start-Process dist\DocumentVault-Setup.exe -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/LOG=setup.log" -Wait
          $app = "$env:LOCALAPPDATA\Programs\Document Vault\App\DocumentVault.exe"
          if (-not (Test-Path $app)) { Get-Content setup.log -Tail 40; throw "the installer didn't install the app" }
          $size = (Get-Item dist\DocumentVault-Setup.exe).Length / 1MB
          Write-Host ("Installed. DocumentVault-Setup.exe is {0:N0} MB" -f $size)
      - name: Click through every screen of the installed app, with screenshots (it sets up its engine from this build)
        if: github.event_name != 'workflow_dispatch' || inputs.full_tests
        shell: powershell
        run: |
          $env:DOCUMENT_VAULT_ENGINE_ARCHIVE = (Resolve-Path dist\DocumentVault-Engine-Windows-*.zip).Path
          powershell -ExecutionPolicy Bypass -File apps/windows/ui-test.ps1 -AppPath "$env:LOCALAPPDATA\Programs\Document Vault\App\DocumentVault.exe" -Out screens
      - name: "Scenarios: the installer's question, connecting to a centre computer, updating from inside the app"
        if: github.event_name != 'workflow_dispatch' || inputs.full_tests
        shell: pwsh
        run: |
          # a pretend newer version (99.0.0) for the app to update to
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DVersion=99.0.0" "/Odist\update" packaging\windows\DocumentVault.iss | Out-Null
          if ($LASTEXITCODE -ne 0) { exit 1 }
          powershell -ExecutionPolicy Bypass -File apps/windows/scenarios.ps1 -Setup dist\DocumentVault-Setup.exe `
            -Newer dist\update\DocumentVault-Setup.exe -Python (Get-Command python).Source -Out screens-scenarios
      - name: Attach the installer to the release (only after it installed and every screen and scenario passed)
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release != ''
        shell: pwsh
        run: |
          $files = @("dist/DocumentVault-Setup.exe")
          if (Test-Path dist/engine-to-upload.txt) { $files += (Get-Content dist/engine-to-upload.txt) }  # a new engine only
          gh release upload "${{ inputs.release || github.ref_name }}" @files --clobber
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Collect the installed app's logs
        if: always()
        shell: pwsh
        run: Copy-Item -Recurse "$env:LOCALAPPDATA\Document Vault\Vault\data\logs" app-logs -ErrorAction SilentlyContinue
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DocumentVault-Windows-screens
          path: |
            screens
            screens-scenarios
            setup.log
            app-logs
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()  # the app is worth having even when a screen in the click-through fails
        with:
          name: DocumentVault-Windows-app
          path: dist/windows-app
          if-no-files-found: ignore

  mac-native:
    # The native Mac app (SwiftUI), built with GitHub's Xcode.
    name: Mac app (SwiftUI)
    if: github.event_name != 'workflow_dispatch' || inputs.full_tests
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: VaultKit tests
        run: cd apps/apple/VaultKit && swift test
      - name: Build Document Vault.app
        run: sh apps/apple/macOS/build_app.sh
      - name: Zip it
        run: cd "apps/apple/macOS/build" && ditto -c -k --keepParent "Document Vault.app" ../../../../DocumentVault-Mac-app.zip
      - uses: actions/upload-artifact@v4
        with:
          name: DocumentVault-Mac-app
          path: DocumentVault-Mac-app.zip
